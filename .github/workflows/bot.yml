name: GitHub Profile Bot

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited]
  discussion:
    types: [created]
  workflow_dispatch:
    inputs:
      question:
        description: 'Ask a question about Piyush'
        required: true
        default: 'What projects has Piyush worked on?'

jobs:
  respond:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      discussions: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pygithub

      - name: Run Bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python .github/bot/bot.py
